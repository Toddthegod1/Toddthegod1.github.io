# Site settings
title: Todd Klinger
tagline: CS & Data Analytics student building data tools, cloud apps, and APIs
description: >-
  Todd Klinger is a Computer Science and Data Analytics student at Dickinson College
  who builds data pipelines, dashboards, cloud apps, and APIs.
url: "https://toddthegod1.github.io"
baseurl: ""
lang: en
timezone: America/New_York

author:
  name: Todd Klinger
  email: toddjek@icloud.com
  github: Toddthegod1
  linkedin: https://www.linkedin.com/in/todd-klinger-35b576269/
  location: Carlisle, PA

# Social card image used by jekyll-seo-tag
image: /assets/img/dunedin.jpg

social:
  name: Todd Klinger
  links:
    - https://github.com/Toddthegod1
    - https://www.linkedin.com/in/todd-klinger-35b576269/

# Visitor analytics (https://www.goatcounter.com). Put your GoatCounter code here,
# e.g. "toddklinger" for toddklinger.goatcounter.com. Leave empty to turn off.
# Only counts visits on the live site, never local previews.
goatcounter:

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

exclude:
  - .devcontainer
  - .vscode
  - tools
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
